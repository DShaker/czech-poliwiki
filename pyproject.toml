[project]
name = "poliwiki"
version = "0.1.0"
description = "Neutral aggregation of Czech politicians' public voting records and legislative activity"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poliwiki = "poliwiki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["poliwiki", "poliwiki.sources"]

[tool.setuptools.package-data]
poliwiki = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
